<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniHelp AI Dashboard</title>
  <style>
    :root {
  --primary: #3b82f6;
  --text: #1e293b;
  --bg: #f8fafc;
  --card: #ffffff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background-color: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: var(--primary);
  color: white;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  font-size: 1.3rem;
}

header button {
  background: white;
  color: var(--primary);
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

header button:hover {
  background: #e2e8f0;
}

.main-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

.card {
  background: var(--card);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  border-radius: 16px;
  padding: 20px;
  flex: 1 1 400px;
  min-height: 400px;
}

h2 {
  color: var(--primary);
  margin-bottom: 10px;
}

.subtitle {
  font-size: 0.9rem;
  color: #475569;
  margin-bottom: 15px;
}

/* Chatbot Section */
.chatbox {
  background: #f1f5f9;
  border-radius: 10px;
  padding: 10px;
  height: 250px;
  overflow-y: auto;
  margin-bottom: 10px;
}

.message {
  background: white;
  padding: 8px 12px;
  border-radius: 10px;
  margin: 8px 0;
  max-width: 80%;
}

.message.ai {
  background: #e0f2fe;
  align-self: flex-start;
}

.message.user {
  background: #d1fae5;
  align-self: flex-end;
  text-align: right;
}

.input-area {
  display: flex;
  gap: 10px;
}

.input-area input {
  flex: 1;
  padding: 10px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
}

.input-area button {
  padding: 10px 20px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

.input-area button:hover {
  background: #2563eb;
}

/* Complaint Tracker */
#complaintList {
  list-style: none;
  margin-top: 10px;
}

#complaintList li {
  background: #f1f5f9;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}

/* Complaint table styling */
#complaintList {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-family: 'Poppins', sans-serif;
  font-size: 15px;
  text-align: left;
  background-color: #ffffff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  border-radius: 10px;
  overflow: hidden;
}

/* Header */
#complaintList thead {
  background-color: #4a90e2;
  color: white;
}

#complaintList th,
#complaintList td {
  padding: 12px 16px;
  border-bottom: 1px solid #ddd;
}

/* Hover effect for rows */
#complaintList tbody tr:hover {
  background-color: #f5f8ff;
}

/* Alternate row color */
#complaintList tbody tr:nth-child(even) {
  background-color: #f9f9f9;
}


.form-section {
  background-color: #fff;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  font-family: 'Poppins', sans-serif;
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  text-align: center;
  margin-bottom: 3ch;
}

.form-section h2 {
  color: #4a90e2;
  margin-bottom: 10px;
}

.subtitle {
  color: #666;
  margin-bottom: 20px;
}

#queryInput {
  width: 100%;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 12px;
  font-size: 15px;
  font-family: inherit;
  resize: none;
  margin-bottom: 5ch;
  margin-top: 5ch;
}

#queryInput:focus {
  border-color: #4a90e2;
  outline: none;
}

#submitBtn {
  background-color: #4a90e2;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
  transition: background-color 0.3s;
}

#submitBtn:hover {
  background-color: #357ac8;
}

.success-message {
  color: #28a745;
  margin-top: 15px;
  font-weight: 500;
}

  </style>
</head>
<body>
  <header>
    <h1>UniHelp AI Dashboard</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <main class="main-container">
    <!-- Chatbot Section -->
    <section class="card form-section">
  <h2>Submit Your Query or Complaint</h2>
  <p class="subtitle">Enter your query or complaint below.</p>

  <form id="queryForm">
    <textarea
      id="queryInput"
      rows="5"
      placeholder="Type your query or complaint here..."
      required
    ></textarea>

    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <span id="formMessage" class="success-message"></span>
  <span id="formmessage"></span>
</section>


    <!-- Complaint Tracker -->
    <section class="card tracker-section">
      <h2>Complaint Tracker</h2>
      <p class="subtitle">View your recent queries and department responses.</p>

      <table id="complaintList">
        <thead>
          <th>Complaint ID</th>
          <th>Complaint</th>
          <th>Department</th>
          <th>Status</th>
          <th>Remarks</th>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script>
    const sendBtn = document.getElementById('sendBtn');
const userInput = document.getElementById('userInput');
const chatbox = document.getElementById('chatbox');
const complaintList = document.querySelector('#complaintList tbody');
const logoutBtn = document.getElementById('logoutBtn');


const faqResponses = {
  "hostel": "Hostel gates are open from 6 AM to 10 PM.",
  "library": "Library is open from 9 AM to 8 PM on weekdays.",
  "fees": "Fees can be paid via ERP portal before 10th of each month.",
  "wifi": "WiFi complaints are handled by the IT department."
};


async function complaintlistget() {
    let n=0
    let complaints=await fetch('/getcomplaintslist',{method:'POST'})
    complaints=await complaints.json()
    complaints.forEach(e => {
      complaintList.innerHTML+=`<tr>
      <td>${n+1}</td>
      <td>${e.title}</td>
      <td>${e.department}</td>
      <td>${e.status}</td>
      <td>${e.remarks}</td>
      </tr>`
      n+=1
    })
}

complaintlistget()


document.getElementById('queryForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const query = document.getElementById('queryInput').value;
  document.getElementById('formMessage').textContent = "Submitting please wait"
  setInterval(() => {
    document.querySelector('#formmessage').textContent+='...'
    setTimeout(() => {
      document.querySelector('#formmessage').textContent=''
    }, 1000);
  }, 2000);
  const response = await fetch('/submit-query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({query: query })
  });

  const result = await response.json();
  if (result.status==200){
    alert('query submitted')
    window.location.reload()
  }
});

  </script>
</body>
</html>
